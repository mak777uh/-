name: lab-contract

# Бесплатный CPU на публичном репозитории — единственная вычислительная машина,
# доступная нам без телефона, карты и VPN (проверено 22.10.2026). GPU здесь нет,
# поэтому работа делим так: численные опыты с TF32 — локально, а всё, что должно
# воспроизводиться «на чужой машине» (контракт, арифметика отчётов, вердикты
# замороженных критериев, тесты), — здесь, на другой ОС и другом процессоре.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Лаборатория работает на Windows, а читатель репозитория — чаще на Linux.
        # Матрица ловит платформенные различия (пути, кодировки, окончания строк).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # Windows-раннер по умолчанию работает в cp1252: печать кириллицы падала
      # в UnicodeEncodeError именно там, хотя локально на cp1251 всё проходило.
      # UTF-8-режим обязателен на всех платформах, иначе проверки «зелёные у
      # себя, красные на чужой машине».
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install -U pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6,<3"
          python -m pip install -r requirements.txt

      # Логи приватных прогонов мы читать не можем (API отдаёт 403 без токена),
      # а аннотации check-run читаются публично. Поэтому падение печатается ещё и
      # как ::error:: с текстом — иначе остаётся только «exit code 1».
      - name: Lab contract
        shell: bash
        run: |
          set +e
          out=$(python scripts/lab.py validate --ci 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            msg=$(printf '%s' "$out" | tail -n 4 | tr '\n' ' ' | tr -s ' ')
            echo "::error title=lab-contract::${msg:0:900}"
            exit $code
          fi

      - name: Canonical E02b artifacts re-verify
        working-directory: morphogenesis
        run: python experiments/E02b_morphospace/scripts/e02b_verify.py

      # Числа в отчётах и рукописи должны пересчитываться на чужой машине, а не
      # только там, где считались: берём артефакты из git и пересчитываем
      # арифметику по сырым строкам.
      - name: E02c numbers re-derivation from raw census rows
        run: python scripts/verify_e02c_numbers.py

      # Вердикт замороженного критерия H-E02C-6 обязан воспроизводиться из
      # артефактов байт в байт, иначе он не вердикт, а мнение.
      - name: E02c seed grid verdict is reproducible from artifacts
        run: |
          python scripts/e02c_seed_grid.py
          git diff --exit-code -- morphogenesis/experiments/E02c_replication/seed_grid.json

      - name: Run cards schema validation
        shell: bash
        run: |
          set +e
          out=$(python scripts/validate_runs.py 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -ne 0 ]; then
            msg=$(printf '%s' "$out" | tail -n 4 | tr '\n' ' ' | tr -s ' ')
            echo "::error title=run-cards::${msg:0:900}"
            exit $code
          fi

      - name: Text integrity (links and section references)
        shell: bash
        run: |
          set +e
          fail=0
          for cmd in "python scripts/check_links.py --all" \
                     "python scripts/check_section_refs.py" \
                     "python scripts/check_references.py" \
                     "python scripts/check_reports_index.py"; do
            out=$($cmd 2>&1)
            code=$?
            printf '%s\n' "$out"
            if [ $code -ne 0 ]; then
              fail=$code
              msg=$(printf '%s' "$out" | tail -n 3 | tr '\n' ' ' | tr -s ' ')
              echo "::error title=${cmd%% *}::${msg:0:900}"
            fi
          done
          exit $fail

      - name: Claims matrix (evidence kinds, assumptions, artifact links)
        run: python scripts/claims_lint.py

      - name: Manuscript numbers match artifacts
        run: python scripts/verify_manuscript_numbers.py

      - name: Formal hypotheses (Lean, if installed)
        shell: bash
        run: |
          set -o pipefail
          python scripts/lean_check.py --ci 2>&1 | tee lean_out.txt
          python - <<'PY'
          import pathlib, sys
          lines = pathlib.Path('lean_out.txt').read_text(encoding='utf-8').splitlines()
          tail = lines[-1] if lines else 'no output'
          print(f'::notice::lean_check: {tail}')
          ignored = any('skipped' in line for line in lines)
          if ignored:
              print('::notice::Lean не установлен на раннере: формальные гипотезы пропущены (не доказаны)')
          PY

      # Мета-контур: инсайты без действия, мёртвые скрипты, цикл-токен волны.
      # Всё это уже проверяется локально; на чужой машине должно падать так же.
      - name: Meta-contour (insights, scripts, wave)
        shell: bash
        run: |
          set +e
          fail=0
          for cmd in "python scripts/insight.py --check" \
                     "python scripts/check_scripts.py --ci"; do
            out=$($cmd 2>&1)
            code=$?
            printf '%s\n' "$out"
            if [ $code -ne 0 ]; then
              fail=$code
              msg=$(printf '%s' "$out" | tail -n 3 | tr '\n' ' ' | tr -s ' ')
              echo "::error title=${cmd%% *}::${msg:0:700}"
            fi
          done
          exit $fail

      # Цикл движется всеми тремя ногами: эксперименты, чтение, гипотезы.
      # Иначе легко «гнать прогоны» и обновлять гипотезы задним числом.
      - name: Cycle legs (experiments / reading / hypotheses)
        run: python scripts/cycle_audit.py --days 1

      # Замечания библиотеки не должны гнить: new старше дня валит сборку.
      - name: Library inbox (no stale board remarks)
        run: python scripts/library_inbox.py --ci

      # Агрегаты обязаны совпадать с первичными артефактами: две ошибки склейки
      # за сутки — системный риск, а не невнимательность.
      - name: Aggregate-vs-artifact check
        run: python scripts/aggregate_check.py --strict

      # Живая серия W2-bud: агрегат должен воспроизводиться из закоммиченных артефактов.
      # Ловит случай, когда агрегат правили руками или артефакты подменили после сборки.
      - name: W2-bud aggregate reproducible from artifacts
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          python scripts/w2bud_matrix.py --out /tmp/w2bud_ci.json
          python - <<'PY'
          import json, pathlib, sys
          fresh = json.loads(pathlib.Path('/tmp/w2bud_ci.json').read_text(encoding='utf-8'))
          committed = json.loads(pathlib.Path('morphogenesis/experiments/E09_pond/w2bud_matrix.json').read_text(encoding='utf-8'))
          def norm(payload):
              rows = payload.get('rows') or []
              return sorted((r.get('arm'), r.get('n'), r.get('n_valid'), r.get('labels_ge2'), r.get('lines'))
                            for r in rows)
          if norm(fresh) != norm(committed):
              print('агрегат W2-bud расходится с артефактами:')
              print(' свежий:', norm(fresh))
              print(' в git: ', norm(committed))
              sys.exit(1)
          print('W2-bud агрегат совпадает с артефактами')
          PY

      - name: CPU tests
        working-directory: morphogenesis
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: python -m pytest -q tests

      # Квитанция воспроизведения: маленький JSON, который можно приложить к
      # статье или показать рецензенту — «на такой-то машине, таким-то питоном и
      # таким-то torch все проверки прошли, вот хеш коммита».
      # Канарейка мира на чужой машине: короткий прогон пруда на CPU, проверка
      # детерминизма по сиду и согласованности счётчиков. GPU на раннере нет,
      # поэтому это именно проверка переносимости, а не научный результат.
      - name: Pond canary (CPU)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci_canary_pond.py 2>&1 | tee canary_out.txt

      - name: Upload canary receipt
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pond-canary
          path: _ci_canary.json
          if-no-files-found: error
          retention-days: 14

      - name: Reproduction receipt
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/ci_receipt.py

      - name: Upload reproduction receipt
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-receipt
          path: reproduction_receipt.json
          if-no-files-found: error
          retention-days: 30

name: lab-contract

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lab-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install -U pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6,<3"
          python -m pip install -r requirements.txt

      - name: Lab contract
        run: python scripts/lab.py validate --ci

      - name: Canonical E02b artifacts re-verify
        working-directory: morphogenesis
        run: python experiments/E02b_morphospace/scripts/e02b_verify.py

      # Числа в отчётах и рукописи должны пересчитываться на чужой машине, а не
      # только там, где считались. Эти два шага берут артефакты из git и
      # независимо пересчитывают арифметику: классы и устойчивость по сырым
      # строкам, вердикт сетки — по замороженному критерию.
      - name: E02c numbers re-derivation from raw census rows
        run: python scripts/verify_e02c_numbers.py

      - name: E02c seed grid verdict is reproducible from artifacts
        run: |
          python scripts/e02c_seed_grid.py
          git diff --exit-code -- morphogenesis/experiments/E02c_replication/seed_grid.json

      - name: Text integrity (links and section references)
        run: |
          python scripts/check_links.py --all
          python scripts/check_section_refs.py
          python scripts/check_references.py
          python scripts/check_reports_index.py

      - name: CPU tests
        working-directory: morphogenesis
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: python -m pytest -q tests
